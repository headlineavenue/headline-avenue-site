<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">Headline Avenue</title>
<desc id="desc">Headline Avenue circular media emblem with HA monogram, globe, signal waves, and play mark.</desc>
<defs>
  <radialGradient id="badge" cx="50%" cy="42%" r="72%">
    <stop offset="0" stop-color="#0a1d38"/>
    <stop offset="0.56" stop-color="#031020"/>
    <stop offset="1" stop-color="#010307"/>
  </radialGradient>
  <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#ffd64f"/>
    <stop offset="0.22" stop-color="#ffd64f"/>
    <stop offset="0.46" stop-color="#00c8ff"/>
    <stop offset="0.82" stop-color="#1378ff"/>
    <stop offset="1" stop-color="#4af0ff"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#1760ff"/>
    <stop offset="0.55" stop-color="#00aef0"/>
    <stop offset="1" stop-color="#33e7ff"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#f3a800"/>
    <stop offset="0.5" stop-color="#ffe47a"/>
    <stop offset="1" stop-color="#ffbf18"/>
  </linearGradient>
  <filter id="glowBlue" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="clip"><circle cx="512" cy="512" r="463"/></clipPath>
</defs>

<circle cx="512" cy="512" r="468" fill="url(#badge)"/>
<circle cx="512" cy="512" r="468" fill="none" stroke="#0a4a78" stroke-width="16" opacity=".9"/>
<circle cx="512" cy="512" r="474" fill="none" stroke="url(#ring)" stroke-width="7" filter="url(#softGlow)"/>

<g clip-path="url(#clip)" opacity=".9">
  <g fill="#007bdc" opacity=".62">
    <path d="M142 278c59-56 138-96 228-111l42 31-24 29-42-3-19 28-37 5-12 28-52 11-27 37-46-13z"/>
    <path d="M407 168l63 9 25 28-24 18-34-9-31 18-25-28z"/>
    <path d="M548 168l48 10 18 25-18 19-34-9-23-26z"/>
    <path d="M636 193l82 25 63 45-13 34-49 4-30-22-31 8-27-19-18-35z"/>
    <path d="M744 303l76 29 34 53-19 44-38-9-28-37-28-9-21-39z"/>
    <path d="M346 620l48 19 10 42-29 28-47-9-18-34 11-30z"/>
    <path d="M628 620l63-2 30 29-8 45-44 24-38-16-14-44z"/>
  </g>
  <g fill="#11bfff" opacity=".9">
    <circle cx="184" cy="212" r="3"/><circle cx="202" cy="221" r="3"/><circle cx="220" cy="231" r="3"/><circle cx="237" cy="244" r="3"/><circle cx="256" cy="255" r="3"/><circle cx="277" cy="267" r="3"/>
    <circle cx="707" cy="222" r="3"/><circle cx="726" cy="232" r="3"/><circle cx="745" cy="245" r="3"/><circle cx="766" cy="258" r="3"/><circle cx="787" cy="276" r="3"/>
    <circle cx="676" cy="296" r="3"/><circle cx="696" cy="308" r="3"/><circle cx="716" cy="322" r="3"/><circle cx="738" cy="335" r="3"/>
  </g>
</g>

<g filter="url(#softGlow)">
  <path d="M149 164a452 452 0 0 1 654-69" fill="none" stroke="#29dcff" stroke-width="10" stroke-linecap="round" opacity=".95"/>
  <path d="M104 694a452 452 0 0 0 172 211" fill="none" stroke="#ffd448" stroke-width="10" stroke-linecap="round" opacity=".95"/>
</g>

<!-- H -->
<path d="M212 355h124l-33 123h139l33-123h124L474 692H350l38-141H249l-38 141H87z" fill="#ffffff"/>
<path d="M212 355h124l-33 123h139l33-123" fill="none" stroke="#d9e3ee" stroke-width="4" opacity=".7"/>

<!-- A -->
<path d="M563 355h139l114 337H683l-18-63H533l-51 63H349zm36 188h39l-17-72z" fill="url(#blue)" stroke="#4df0ff" stroke-width="3"/>

<!-- radio waves -->
<g fill="none" stroke="#08bfff" stroke-width="18" stroke-linecap="round" filter="url(#glowBlue)">
  <path d="M746 378c53 38 53 111 0 149"/>
  <path d="M788 345c86 61 86 181 0 242"/>
  <path d="M828 315c116 82 116 245 0 327"/>
</g>

<text x="512" y="770" text-anchor="middle" fill="#ffffff" font-size="86" font-weight="800" letter-spacing="18" font-family="Arial,Helvetica,sans-serif">HEADLINE</text>
<line x1="226" y1="826" x2="320" y2="826" stroke="url(#gold)" stroke-width="8"/>
<text x="512" y="846" text-anchor="middle" fill="#00bfff" font-size="60" font-weight="800" letter-spacing="28" font-family="Arial,Helvetica,sans-serif">AVENUE</text>
<line x1="706" y1="826" x2="800" y2="826" stroke="url(#gold)" stroke-width="8"/>

<!-- motion lines + play -->
<g filter="url(#softGlow)">
  <rect x="366" y="888" width="135" height="8" rx="4" fill="#1164ff"/>
  <rect x="392" y="905" width="109" height="8" rx="4" fill="#0a8cff"/>
  <rect x="420" y="922" width="81" height="8" rx="4" fill="#25dfff"/>
  <path d="M525 882l76 46-76 46z" fill="url(#gold)" stroke="#ffe47a" stroke-width="3"/>
</g>
</svg>