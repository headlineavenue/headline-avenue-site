name: Backend tests

on:
  push:
    branches:
      - main
      - feature/media-ingestion-foundation
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: headline
          POSTGRES_PASSWORD: headline
          POSTGRES_DB: headline_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U headline -d headline_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      MIGRATION_TEST_DATABASE_URL: postgresql://headline:headline@127.0.0.1:5432/headline_migration_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile backend
        run: python -m compileall -q app

      - name: Check frontend JavaScript syntax
        working-directory: .
        run: |
          node --check runtime-config.js
          node --check auth.js
          node --check app.js
          node --check real-stories.js
          node --check real-sources.js

      - name: Run tests
        run: pytest -q

      - name: Verify legacy Postgres migration
        run: python tests/verify_postgres_migration.py
